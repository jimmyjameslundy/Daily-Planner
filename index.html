<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Drive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <meta name="theme-color" content="#6366f1">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-200 min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-4xl font-bold text-indigo-600">Daily Drive</h1>
        <p id="currentDate" class="text-slate-500"></p>
      </div>
    </div>

    <!-- Sync -->
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 mb-6 shadow">
      <h2 class="text-xl font-semibold mb-4">Google Drive Sync</h2>
      <div class="flex gap-4">
        <button onclick="exportBackup()" class="flex-1 py-4 bg-emerald-600 text-white rounded-2xl">💾 Save Backup</button>
        <button onclick="importBackup()" class="flex-1 py-4 bg-amber-600 text-white rounded-2xl">📥 Load Backup</button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Tasks -->
      <div class="lg:col-span-8">
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow">
          <h2 class="text-2xl font-semibold mb-4">Today's Tasks</h2>
          
          <div class="flex gap-3 mb-6 flex-wrap">
            <input type="text" id="taskInput" class="flex-1 px-5 py-3 rounded-2xl border" placeholder="Task description">
            <select id="prioritySelect" class="px-4 py-3 rounded-2xl border">
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
            <input type="text" id="assigneeInput" class="w-48 px-4 py-3 rounded-2xl border" placeholder="Assign to (Name)">
            <input type="email" id="emailInput" class="w-56 px-4 py-3 rounded-2xl border" placeholder="Email address">
            <button onclick="addTask()" class="px-8 py-3 bg-indigo-600 text-white rounded-2xl">Add & Assign</button>
          </div>

          <div id="taskList" class="space-y-3"></div>
        </div>
      </div>

      <!-- Sidebar (same as before) -->
      <div class="lg:col-span-4 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow">
          <h2 class="text-xl font-semibold mb-4">Daily Habits</h2>
          <div id="habitList" class="space-y-3"></div>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow text-center">
          <h2 class="text-xl font-semibold mb-4">Focus Timer</h2>
          <div id="timer" class="text-6xl font-bold mb-6 text-indigo-600">25:00</div>
          <div class="flex gap-4 justify-center">
            <button onclick="startTimer()" class="px-8 py-3 bg-emerald-600 text-white rounded-2xl">Start</button>
            <button onclick="resetTimer()" class="px-8 py-3 bg-slate-600 text-white rounded-2xl">Reset</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('dd_tasks') || '[]');

    function addTask() {
      const text = document.getElementById('taskInput').value.trim();
      const priority = document.getElementById('prioritySelect').value;
      const assignee = document.getElementById('assigneeInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();

      if (!text) {
        alert("Please enter a task");
        return;
      }

      const followUp = prompt("Enter follow-up date (YYYY-MM-DD):", new Date(Date.now() + 7*24*60*60*1000).toISOString().split('T')[0]);

      tasks.push({
        text: text,
        completed: false,
        priority: priority,
        assignee: assignee,
        email: email,
        followUp: followUp,
        date: new Date().toISOString().split('T')[0],
        alerted: false
      });

      localStorage.setItem('dd_tasks', JSON.stringify(tasks));

      // Open email client if email is provided
      if (email) {
        const subject = encodeURIComponent(`Task Assignment: ${text}`);
        const body = encodeURIComponent(`Hi ${assignee || ''},\n\nI've assigned you the following task:\n\n${text}\n\nFollow-up Date: ${followUp}\n\nPlease let me know when it's completed.\n\nThank you!`);
        
        window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
      } else if (assignee) {
        alert(`Task assigned to ${assignee}.\n\n(No email address provided - email not opened)`);
      }

      // Clear inputs
      document.getElementById('taskInput').value = '';
      document.getElementById('assigneeInput').value = '';
      document.getElementById('emailInput').value = '';

      renderTasks();
    }

    function renderTasks() {
      const container = document.getElementById('taskList');
      container.innerHTML = '';

      tasks.forEach((task, i) => {
        const div = document.createElement('div');
        div.className = `flex items-center gap-4 p-5 rounded-2xl bg-slate-100 dark:bg-slate-800`;
        div.innerHTML = `
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${i})" class="w-6 h-6">
          <div class="flex-1">
            <span class="${task.completed ? 'line-through text-slate-400' : ''}">${task.text}</span>
            ${task.assignee ? `<p class="text-sm text-indigo-600">Assigned to: <strong>${task.assignee}</strong></p>` : ''}
            ${task.email ? `<p class="text-xs text-slate-500">${task.email}</p>` : ''}
            ${task.followUp ? `<p class="text-xs text-amber-600">Follow-up: ${task.followUp}</p>` : ''}
          </div>
          <button onclick="deleteTask(${i})" class="text-red-500 text-xl">×</button>
        `;
        container.appendChild(div);
      });
    }

    function toggleTask(i) {
      tasks[i].completed = !tasks[i].completed;
      localStorage.setItem('dd_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function deleteTask(i) {
      tasks.splice(i, 1);
      localStorage.setItem('dd_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function checkDueDates() {
      const today = new Date().toISOString().split('T')[0];
      tasks.forEach(task => {
        if (task.followUp === today && !task.alerted) {
          alert(`🔔 FOLLOW-UP DUE TODAY!\n\n${task.text}\nAssigned to: ${task.assignee || 'Person'}`);
          task.alerted = true;
          localStorage.setItem('dd_tasks', JSON.stringify(tasks));
        }
      });
    }

    window.onload = () => {
      renderTasks();
      checkDueDates();
      setInterval(checkDueDates, 60000);
    };
  </script>
</body>
</html>
