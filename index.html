<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Drive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-200 min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-4xl font-bold text-indigo-600">Daily Drive</h1>
        <p id="currentDate" class="text-slate-500"></p>
      </div>
      <button onclick="showInstallHelp()" class="px-5 py-2 bg-indigo-600 text-white rounded-2xl flex items-center gap-2">
        <i class="fas fa-mobile-alt"></i> App Tips
      </button>
    </div>

    <!-- Weekly Navigation -->
    <div class="flex items-center justify-between mb-6 bg-white dark:bg-slate-900 p-4 rounded-3xl">
      <button onclick="prevWeek()" class="p-3 hover:bg-slate-100 rounded-2xl"><i class="fas fa-chevron-left"></i></button>
      <div id="weekRange" class="font-semibold text-lg"></div>
      <button onclick="nextWeek()" class="p-3 hover:bg-slate-100 rounded-2xl"><i class="fas fa-chevron-right"></i></button>
    </div>

    <!-- Google Drive Sync -->
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 mb-6 shadow">
      <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
        <i class="fas fa-cloud"></i> Google Drive Sync
      </h2>
      <div class="flex gap-4">
        <button onclick="exportToGoogleDrive()" class="flex-1 py-4 bg-emerald-600 text-white rounded-2xl font-medium">
          💾 Save to Google Drive
        </button>
        <button onclick="importFromGoogleDrive()" class="flex-1 py-4 bg-amber-600 text-white rounded-2xl font-medium">
          📥 Load from Google Drive
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <div class="lg:col-span-8">
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow">
          <h2 class="text-2xl font-semibold mb-4" id="mainTitle">Today's Tasks</h2>
          
          <div class="flex gap-3 mb-6">
            <input type="text" id="taskInput" class="flex-1 px-5 py-3 rounded-2xl border" placeholder="Add new task...">
            <select id="prioritySelect" class="px-4 py-3 rounded-2xl border">
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
            <button onclick="addTask()" class="px-8 py-3 bg-indigo-600 text-white rounded-2xl">Add</button>
          </div>

          <div id="taskList" class="space-y-3"></div>
        </div>
      </div>

      <div class="lg:col-span-4 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow">
          <h2 class="text-xl font-semibold mb-4">Daily Habits</h2>
          <div id="habitList" class="space-y-3"></div>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow">
          <h2 class="text-xl font-semibold mb-4">Focus Timer</h2>
          <div id="timer" class="text-6xl font-bold text-center text-indigo-600 mb-6">25:00</div>
          <div class="flex gap-4 justify-center">
            <button onclick="startTimer()" class="px-6 py-3 bg-emerald-600 text-white rounded-2xl">Start</button>
            <button onclick="resetTimer()" class="px-6 py-3 bg-slate-600 text-white rounded-2xl">Reset</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date().toISOString().split('T')[0];
    let viewMode = 'daily';
    let weekStart = new Date();

    let tasks = JSON.parse(localStorage.getItem('dd_tasks') || '[]');
    let habits = JSON.parse(localStorage.getItem('dd_habits') || [
      {id:1, name:"Exercise 30min", completed:false},
      {id:2, name:"Read 20 pages", completed:false},
      {id:3, name:"Drink 3L water", completed:false}
    ]);

    function updateDateDisplay() {
      document.getElementById('currentDate').textContent = new Date(currentDate).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      document.getElementById('mainTitle').textContent = viewMode === 'weekly' ? "Weekly Tasks" : "Today's Tasks";
    }

    function renderTasks() {
      const container = document.getElementById('taskList');
      container.innerHTML = '';

      const filtered = tasks.filter(t => t.date === currentDate);

      filtered.forEach((task, idx) => {
        const globalIdx = tasks.findIndex(t => t === task);
        const div = document.createElement('div');
        div.className = `flex items-center gap-4 p-5 rounded-2xl bg-slate-100 dark:bg-slate-800`;
        div.innerHTML = `
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${globalIdx})">
          <span class="flex-1">${task.text}</span>
          <span class="text-xs px-3 py-1 rounded-full ${task.priority === 'high' ? 'bg-red-100 text-red-700' : task.priority === 'low' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
            ${task.priority?.toUpperCase() || 'MED'}
          </span>
          <button onclick="deleteTask(${globalIdx})" class="text-red-500">×</button>
        `;
        container.appendChild(div);
      });
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const priority = document.getElementById('prioritySelect').value;
      if (!input.value.trim()) return;

      tasks.push({
        text: input.value.trim(),
        completed: false,
        priority: priority,
        date: currentDate
      });
      localStorage.setItem('dd_tasks', JSON.stringify(tasks));
      input.value = '';
      renderTasks();
    }

    function toggleTask(i) {
      tasks[i].completed = !tasks[i].completed;
      localStorage.setItem('dd_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function deleteTask(i) {
      tasks.splice(i, 1);
      localStorage.setItem('dd_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function renderHabits() {
      const container = document.getElementById('habitList');
      container.innerHTML = '';
      habits.forEach((habit, i) => {
        const div = document.createElement('div');
        div.className = `p-4 rounded-2xl cursor-pointer flex items-center gap-3 ${habit.completed ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}`;
        div.innerHTML = `<input type="checkbox" ${habit.completed ? 'checked' : ''}> <span>${habit.name}</span>`;
        div.onclick = () => {
          habits[i].completed = !habits[i].completed;
          localStorage.setItem('dd_habits', JSON.stringify(habits));
          renderHabits();
        };
        container.appendChild(div);
      });
    }

    // Timer
    let timerInterval;
    function startTimer() {
      let time = 25*60;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        time--;
        const m = Math.floor(time/60);
        const s = time % 60;
        document.getElementById('timer').textContent = `${m}:${s<10?'0':''}${s}`;
        if (time <= 0) clearInterval(timerInterval);
      }, 1000);
    }
    function resetTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer').textContent = "25:00";
    }

    // Weekly Navigation
    function updateWeekDisplay() {
      const end = new Date(weekStart);
      end.setDate(end.getDate() + 6);
      document.getElementById('weekRange').textContent = 
        `${weekStart.toLocaleDateString('en-US', {month:'short', day:'numeric'})} - ${end.toLocaleDateString('en-US', {month:'short', day
