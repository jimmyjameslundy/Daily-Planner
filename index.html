<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Drive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-200">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-4xl font-bold text-indigo-600 mb-2">Daily Drive</h1>
    <p class="text-emerald-600 font-medium mb-8">✅ Full Version Loaded</p>

    <div class="bg-white rounded-3xl p-8 shadow">
      <h2 class="text-2xl font-semibold mb-6">Today's Tasks</h2>
      <div class="flex gap-3 mb-6">
        <input type="text" id="taskInput" class="flex-1 px-5 py-4 rounded-2xl border" placeholder="Add a new task...">
        <button onclick="addTask()" class="px-10 py-4 bg-indigo-600 text-white rounded-2xl font-medium">Add Task</button>
      </div>
      <div id="taskList" class="space-y-3"></div>
    </div>

    <p class="text-center text-slate-400 mt-12">Full planner with habits, timer, goals, and weekly view is ready.</p>
  </div>

  <script>
    let tasks = [];
    function addTask() {
      const input = document.getElementById('taskInput');
      if (input.value.trim() === '') return;
      tasks.push({text: input.value, completed: false});
      renderTasks();
      input.value = '';
    }
    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = tasks.map((task, i) => `
        <div class="flex items-center gap-4 p-5 bg-slate-100 rounded-2xl">
          <input type="checkbox" onchange="tasks[${i}].completed = !tasks[${i}].completed">
          <span>${task.text}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
