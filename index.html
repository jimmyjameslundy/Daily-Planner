<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Drive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-200 min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-4xl font-bold text-indigo-600">Daily Drive</h1>
        <p id="currentDate" class="text-slate-500 dark:text-slate-400"></p>
      </div>
      <button onclick="showInstallHelp()" class="px-5 py-2 bg-indigo-600 text-white rounded-2xl text-sm flex items-center gap-2">
        <i class="fas fa-mobile-alt"></i> App Tips
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Main Tasks -->
      <div class="lg:col-span-8 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-semibold">Today's Tasks</h2>
            <span id="progress" class="text-sm font-medium text-indigo-600">0% Complete</span>
          </div>
          
          <div class="flex gap-3 mb-6">
            <input type="text" id="taskInput" class="flex-1 px-5 py-3 rounded-2xl border" placeholder="What needs to get done today?">
            <select id="prioritySelect" class="px-4 py-3 rounded-2xl border">
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
            <button onclick="addTask()" class="px-8 py-3 bg-indigo-600 text-white rounded-2xl">Add</button>
          </div>

          <div id="taskList" class="space-y-3 min-h-[320px]"></div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="lg:col-span-4 space-y-6">

        <!-- Focus Timer -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow text-center">
          <h2 class="text-xl font-semibold mb-4">Focus Timer</h2>
          <div id="timer" class="text-6xl font-bold mb-6 text-indigo-600">25:00</div>
          <div class="flex justify-center gap-4">
            <button onclick="startTimer()" class="px-6 py-3 bg-emerald-600 text-white rounded-2xl">Start</button>
            <button onclick="resetTimer()" class="px-6 py-3 bg-slate-600 text-white rounded-2xl">Reset</button>
          </div>
        </div>

        <!-- Habits -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow">
          <h2 class="text-xl font-semibold mb-4">Daily Habits</h2>
          <div id="habitList" class="space-y-3"></div>
        </div>

        <!-- Goals & Schedule -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow">
          <h2 class="text-xl font-semibold mb-4">Goals</h2>
          <textarea id="monthlyGoals" rows="3" class="w-full p-4 rounded-2xl border mb-4" placeholder="Monthly Goals..."></textarea>
          <textarea id="quarterlyGoals" rows="3" class="w-full p-4 rounded-2xl border" placeholder="Quarterly Goals..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('dd_tasks') || '[]');
    let habits = JSON.parse(localStorage.getItem('dd_habits') || [
      { id: 1, name: "Exercise 30min", completed: false },
      { id: 2, name: "Read 20 pages", completed: false },
      { id: 3, name: "Drink 3L water", completed: false },
      { id: 4, name: "Review Goals", completed: false }
    ]);

    function updateDate() {
      document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }

    function renderTasks() {
      const container = document.getElementById('taskList');
      container.innerHTML = '';
      let completedCount = 0;

      tasks.forEach((task, i) => {
        if (task.completed) completedCount++;
        const div = document.createElement('div');
        div.className = `flex items-center gap-4 p-5 rounded-2xl bg-slate-100 dark:bg-slate-800 ${task.priority || 'medium'}`;
        div.draggable = true;
        div.dataset.index = i;
        div.innerHTML = `
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${i})" class="w-6 h-6">
          <span class="flex-1 ${task.completed ? 'line-through text-slate-400' : ''}">${task.text}</span>
          <span class="text-xs px-3 py-1 rounded-full ${task.priority === 'high' ? 'bg-red-100 text-red-700' : task.priority === 'low' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
            ${task.priority?.toUpperCase() || 'MED'}
          </span>
          <button onclick="deleteTask(${i})" class="text-red-500">×</button>
        `;
        container.appendChild(div);
      });

      const progress = tasks.length ? Math.round((completedCount / tasks.length) * 100) : 0;
      document.getElementById('progress').textContent = `${progress}% Complete`;
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const priority = document.getElementById('prioritySelect').value;
      if (!input.value.trim()) return;
      
      tasks.push({ text: input.value.trim(), completed: false, priority });
      localStorage.setItem('dd_tasks', JSON.stringify(tasks));
      input.value = '';
      renderTasks();
    }

    function toggleTask(i) {
      tasks[i].completed = !tasks[i].completed;
      localStorage.setItem('dd_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function deleteTask(i) {
      tasks.splice(i, 1);
      localStorage.setItem('dd_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function renderHabits() {
      const container = document.getElementById('habitList');
      container.innerHTML = '';
      habits.forEach((habit, i) => {
        const div = document.createElement('div');
        div.className = `flex items-center gap-3 p-4 rounded-2xl cursor-pointer ${habit.completed ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}`;
        div.innerHTML = `
          <input type="checkbox" ${habit.completed ? 'checked' : ''} class="w-5 h-5">
          <span class="flex-1">${habit.name}</span>
        `;
        div.onclick = () => {
          habits[i].completed = !habits[i].completed;
          localStorage.setItem('dd_habits', JSON.stringify(habits));
          renderHabits();
        };
        container.appendChild(div);
      });
    }

    // Timer
    let timerInterval;
    function startTimer() {
      let time = 25 * 60;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        time--;
        const min = Math.floor(time / 60);
        const sec = time % 60;
        document.getElementById('timer').textContent = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        if (time <= 0) clearInterval(timerInterval);
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer').textContent = "25:00";
    }

    function showInstallHelp() {
      alert("✅ Your Daily Drive app is installed!\n\nOpen it anytime from your desktop or app list.");
    }

    // Load everything
    window.onload = () => {
      updateDate();
      renderTasks();
      renderHabits();

      // Auto-save goals when typing
      document.getElementById('monthlyGoals').value = localStorage.getItem('monthlyGoals') || '';
      document.getElementById('quarterlyGoals').value = localStorage.getItem('quarterlyGoals') || '';
      
      ['monthlyGoals', 'quarterlyGoals'].forEach(id => {
        document.getElementById(id).addEventListener('input', () => {
          localStorage.setItem(id, document.getElementById(id).value);
        });
      });
    };
  </script>
</body>
</html>
